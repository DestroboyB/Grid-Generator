<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Grid Generator</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css"
    >

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"
    ></script>

</head>

<body>

    <!-- ========================================
         MAIN APPLICATION
    ========================================= -->

    <main class="app">

        <!-- ========================================
             Library Button
        ========================================= -->

        <button
            id="libraryButton"
            type="button"
            class="library-button"
        >
            My Grids
        </button>


        <!-- ========================================
             CONTROLS
        ========================================= -->

        <section class="controls">

            <!-- Rows -->

            <div class="control-group">

                <label for="rows">
                    Rows
                </label>

                <select id="rows">

                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3" selected>3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>

                </select>

            </div>


            <!-- Separator -->

            <div class="dimension-separator">
                ×
            </div>


            <!-- Columns -->

            <div class="control-group">

                <label for="columns">
                    Columns
                </label>

                <select id="columns">

                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3" selected>3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>

                </select>

            </div>


            <!-- Image Ratio -->

            <div class="control-group ratio-control">

                <label for="imageRatio">
                    Image Ratio
                </label>

                <select id="imageRatio">

                    <option value="1:1" selected>
                        1:1
                    </option>

                    <option value="4:3">
                        4:3
                    </option>

                    <option value="3:2">
                        3:2
                    </option>

                    <option value="16:9">
                        16:9
                    </option>

                    <option value="3:4">
                        3:4
                    </option>

                    <option value="2:3">
                        2:3
                    </option>

                    <option value="9:16">
                        9:16
                    </option>

                </select>

            </div>


            <!-- Spacing -->

            <div class="control-group spacing-control">

                <label for="spacing">
                    Spacing
                </label>

                <div class="range-control">

                    <input
                        type="range"
                        id="spacing"
                        min="0"
                        max="50"
                        value="0"
                    >

                    <span id="spacingValue">
                        0 px
                    </span>

                </div>

            </div>


            <!-- Background -->

            <div class="control-group">

                <label for="backgroundColor">
                    Background
                </label>

                <input
                    type="color"
                    id="backgroundColor"
                    value="#ffffff"
                >

            </div>


            <!-- Action Buttons -->

            <div class="control-actions">

                <button
                    id="generateBoard"
                    type="button"
                >
                    Generate
                </button>

                <button
                    id="bulkImportButton"
                    type="button"
                >
                    Bulk Import
                </button>

                <button
                    id="clearBoardButton"
                    type="button"
                >
                    Clear
                </button>

                <button
                    id="undoButton"
                    type="button"
                >
                    Undo
                </button>

                <button
                    id="redoButton"
                    type="button"
                >
                    Redo
                </button>

            </div>

        </section>


        <!-- ========================================
             BOARD
        ========================================= -->

        <div class="board-container">

            <section
                id="board"
                class="board"
            ></section>

        </div>


        <!-- ========================================
             DOWNLOAD
        ========================================= -->

        <div class="download-container">

            <button
                id="downloadButton"
                type="button"
                class="download-button primary-button"
            >
                Download
            </button>

            <div
                id="downloadMenu"
                class="download-menu"
            >

                <button
                    id="downloadPngButton"
                    type="button"
                    data-format="png"
                >
                    PNG
                </button>

                <button
                    id="downloadJpgButton"
                    type="button"
                    data-format="jpg"
                >
                    JPG
                </button>

                <button
                    id="downloadWebpButton"
                    type="button"
                    data-format="webp"
                >
                    WebP
                </button>

                <button
                    id="closeDownloadMenuButton"
                    type="button"
                >
                    Close
                </button>

            </div>

        </div>

    </main>


    <!-- ========================================
         LIBRARY OVERLAY
    ========================================= -->

    <div
        id="libraryOverlay"
        class="library-overlay"
    ></div>


    <!-- ========================================
         LIBRARY PANEL
    ========================================= -->

    <aside
        id="libraryPanel"
        class="library-panel"
        aria-hidden="true"
    >

        <div class="library-header">

            <h2>
                My Grids
            </h2>

            <button
                id="libraryCloseButton"
                type="button"
                class="library-close-button"
                aria-label="Close library"
            >
                ×
            </button>

        </div>


        <div
            id="libraryContent"
            class="library-content"
        ></div>


        <div class="library-actions">

            <button
                id="newGridButton"
                type="button"
            >
                New Grid
            </button>

            <button
                id="newCategoryButton"
                type="button"
            >
                New Category
            </button>

        </div>

    </aside>


    <!-- ========================================
         NEW GRID MODAL
    ========================================= -->

    <div
        id="newGridModal"
        class="library-modal"
        aria-hidden="true"
    >

        <div class="library-modal-content">

            <h3>
                New Grid
            </h3>

            <label for="newGridNameInput">
                Grid Name
            </label>

            <input
                id="newGridNameInput"
                type="text"
                maxlength="100"
                placeholder="Enter grid name"
            >

            <div class="library-modal-actions">

                <button
                    id="cancelNewGridButton"
                    type="button"
                >
                    Cancel
                </button>

                <button
                    id="createNewGridButton"
                    type="button"
                >
                    Create
                </button>

            </div>

        </div>

    </div>


    <!-- ========================================
         IMAGE EDITOR / CROPPER MODAL
    ========================================= -->

    <div
        id="cropModal"
        class="image-editor-modal"
    >

        <div class="image-editor-container">

            <!-- Editor Header -->

            <div class="cropper-header">

                <h2>
                    Edit Image
                </h2>

                <button
                    id="closeCropperButton"
                    type="button"
                    class="editor-close"
                    aria-label="Close editor"
                >
                    ×
                </button>

            </div>


            <!-- Editor Body -->

            <div class="cropper-body">

                <!-- Cropper Image Area -->

                <div class="cropper-image-container">

                    <img
                        id="cropImage"
                        src=""
                        alt="Image editor"
                    >

                </div>


                <!-- Editor Tabs -->

                <div class="editor-tools">

                    <button
                        type="button"
                        class="editor-tool active"
                        data-tool="transform"
                    >
                        Transform
                    </button>

                    <button
                        type="button"
                        class="editor-tool"
                        data-tool="adjust"
                    >
                        Adjust
                    </button>

                    <button
                        type="button"
                        class="editor-tool"
                        data-tool="filters"
                    >
                        Filters
                    </button>

                </div>


                <!-- Editor Panels -->

                <div class="editor-panel-container">

                    <!-- ========================================
                         TRANSFORM
                    ========================================= -->

                    <div
                        class="editor-panel active"
                        data-panel="transform"
                    >

                        <div class="editor-panel-title">
                            Transform
                        </div>

                        <div class="editor-panel-description">
                            Crop the image using the crop area above, or transform the image below.
                        </div>

                        <div class="editor-controls">

                            <button
                                id="rotateLeftButton"
                                type="button"
                                class="editor-action"
                            >
                                Rotate Left
                            </button>

                            <button
                                id="rotateRightButton"
                                type="button"
                                class="editor-action"
                            >
                                Rotate Right
                            </button>

                            <button
                                id="flipHorizontalButton"
                                type="button"
                                class="editor-action"
                            >
                                Flip Horizontal
                            </button>

                            <button
                                id="flipVerticalButton"
                                type="button"
                                class="editor-action"
                            >
                                Flip Vertical
                            </button>

                            <button
                                id="restoreOriginalButton"
                                type="button"
                                class="editor-action"
                            >
                                Restore Original
                            </button>

                        </div>

                    </div>


                    <!-- ========================================
                         ADJUST
                    ========================================= -->

                    <div
                        class="editor-panel"
                        data-panel="adjust"
                    >

                        <div class="editor-panel-title">
                            Adjust
                        </div>

                        <div class="editor-panel-description">
                            Fine-tune the appearance of the image.
                        </div>

                        <div class="adjust-controls">

                            <label for="brightnessInput">

                                Brightness

                                <input
                                    id="brightnessInput"
                                    type="range"
                                    min="0"
                                    max="200"
                                    value="100"
                                >

                                <span id="brightnessValue">
                                    100%
                                </span>

                            </label>


                            <label for="contrastInput">

                                Contrast

                                <input
                                    id="contrastInput"
                                    type="range"
                                    min="0"
                                    max="200"
                                    value="100"
                                >

                                <span id="contrastValue">
                                    100%
                                </span>

                            </label>


                            <label for="saturationInput">

                                Saturation

                                <input
                                    id="saturationInput"
                                    type="range"
                                    min="0"
                                    max="200"
                                    value="100"
                                >

                                <span id="saturationValue">
                                    100%
                                </span>

                            </label>


                            <label for="blurInput">

                                Blur

                                <input
                                    id="blurInput"
                                    type="range"
                                    min="0"
                                    max="20"
                                    value="0"
                                >

                                <span id="blurValue">
                                    0px
                                </span>

                            </label>

                        </div>

                    </div>


                    <!-- ========================================
                         FILTERS
                    ========================================= -->

                    <div
                        class="editor-panel"
                        data-panel="filters"
                    >

                        <div class="editor-panel-title">
                            Filters
                        </div>

                        <div class="editor-panel-description">
                            Apply a preset filter to the image.
                        </div>

                        <div
                            id="filterButtons"
                            class="filter-controls"
                        >

                            <button
                                type="button"
                                class="filter-button active"
                                data-filter="original"
                            >
                                Original
                            </button>

                            <button
                                type="button"
                                class="filter-button"
                                data-filter="grayscale"
                            >
                                Grayscale
                            </button>

                            <button
                                type="button"
                                class="filter-button"
                                data-filter="sepia"
                            >
                                Sepia
                            </button>

                            <button
                                type="button"
                                class="filter-button"
                                data-filter="warm"
                            >
                                Warm
                            </button>

                            <button
                                type="button"
                                class="filter-button"
                                data-filter="cool"
                            >
                                Cool
                            </button>

                            <button
                                type="button"
                                class="filter-button"
                                data-filter="vintage"
                            >
                                Vintage
                            </button>

                            <button
                                type="button"
                                class="filter-button"
                                data-filter="highContrast"
                            >
                                High Contrast
                            </button>

                        </div>

                    </div>

                </div>

            </div>


            <!-- Editor Footer -->

            <div class="cropper-footer">

                <button
                    id="cancelButton"
                    type="button"
                >
                    Cancel
                </button>

                <button
                    id="cropButton"
                    type="button"
                    class="primary-button"
                >
                    Apply
                </button>

            </div>

        </div>

    </div>


    <!-- ========================================
         EXISTING IMAGE MENU
    ========================================= -->

    <div
        id="imageMenu"
        class="image-menu"
    >

        <button
            id="updateImageButton"
            type="button"
        >
            Edit Image
        </button>

        <button
            id="replaceImageButton"
            type="button"
        >
            Replace Image
        </button>

        <button
            id="replaceWithMalButton"
            type="button"
        >
            Replace with MAL
        </button>

        <button
            id="deleteImageButton"
            type="button"
            class="danger-button"
        >
            Delete Image
        </button>

        <button
            id="closeImageMenuButton"
            type="button"
        >
            Close
        </button>

    </div>


    <!-- ========================================
         EMPTY IMAGE MENU
    ========================================= -->

    <div
        id="addImageMenu"
        class="add-image-menu"
    >

        <button
            id="uploadImageButton"
            type="button"
        >
            Upload Image
        </button>

        <button
            id="searchMalButton"
            type="button"
        >
            Search MAL
        </button>

        <button
            id="closeAddImageMenuButton"
            type="button"
        >
            Close
        </button>

    </div>


    <!-- ========================================
         FILE INPUT
    ========================================= -->

    <input
        id="imageInput"
        type="file"
        accept="image/*"
        hidden
    >


    <!-- ========================================
         MAL SEARCH MODAL
    ========================================= -->

    <div
        id="malSearchModal"
        class="mal-search-modal"
    >

        <div class="mal-search-window">

            <!-- MAL Header -->

            <div class="mal-search-header">

                <h2>
                    MyAnimeList Search
                </h2>

                <button
                    id="malSearchCloseButton"
                    type="button"
                    class="editor-close"
                    aria-label="Close MAL search"
                >
                    ×
                </button>

            </div>


            <!-- MAL Tabs -->

            <div class="mal-search-tabs">

                <button
                    id="malCharacterTab"
                    type="button"
                    class="mal-search-tab active"
                >
                    Characters
                </button>

                <button
                    id="malAnimeTab"
                    type="button"
                    class="mal-search-tab"
                >
                    Anime
                </button>

            </div>


            <!-- MAL Search Controls -->

            <div class="mal-search-controls">

                <input
                    id="malSearchInput"
                    type="text"
                    placeholder="Search for a character..."
                >

                <button
                    id="malSearchButton"
                    type="button"
                >
                    Search
                </button>

            </div>


            <!-- MAL Status -->

            <div
                id="malSearchStatus"
                class="mal-search-status"
            ></div>


            <!-- MAL Results -->

            <div
                id="malSearchResults"
                class="mal-search-results"
            ></div>


            <!-- MAL Navigation -->

            <div class="mal-search-navigation">

                <button
                    id="malSearchBackButton"
                    type="button"
                    class="mal-search-back"
                >
                    Back
                </button>

            </div>

        </div>

    </div>


    <!-- ========================================
         MAIN JAVASCRIPT
    ========================================= -->

    <script
        type="module"
        src="./js/main.js"
    ></script>

</body>

</html>

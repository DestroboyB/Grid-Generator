<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Grid Generator</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <!-- ========================================
         Main Application
    ========================================= -->

    <main class="app">

        <!-- ========================================
             Library Button
        ========================================= -->

        <button
            id="libraryButton"
            type="button"
            class="library-button"
        >
            My Grids
        </button>


        <!-- ========================================
             Controls
        ========================================= -->

        <section class="controls">

            <!-- Rows -->

            <div class="control-group">

                <label for="rows">
                    Rows
                </label>

                <select id="rows">

                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3" selected>3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>

                </select>

            </div>


            <!-- Dimension Separator -->

            <div class="dimension-separator">
                ×
            </div>


            <!-- Columns -->

            <div class="control-group">

                <label for="columns">
                    Columns
                </label>

                <select id="columns">

                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3" selected>3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="6">6</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                    <option value="9">9</option>
                    <option value="10">10</option>

                </select>

            </div>


            <!-- Image Ratio -->

            <div class="control-group ratio-control">

                <label for="imageRatio">
                    Image Ratio
                </label>

                <select id="imageRatio">

                    <option value="1:1" selected>
                        1:1
                    </option>

                    <option value="4:3">
                        4:3
                    </option>

                    <option value="3:2">
                        3:2
                    </option>

                    <option value="16:9">
                        16:9
                    </option>

                    <option value="3:4">
                        3:4
                    </option>

                    <option value="2:3">
                        2:3
                    </option>

                    <option value="9:16">
                        9:16
                    </option>

                </select>

            </div>


            <!-- Spacing -->

            <div class="control-group spacing-control">

                <label for="spacing">
                    Spacing
                </label>

                <div class="range-control">

                    <input
                        type="range"
                        id="spacing"
                        min="0"
                        max="50"
                        value="0"
                    >

                    <span id="spacingValue">
                        0 px
                    </span>

                </div>

            </div>


            <!-- Background -->

            <div class="control-group">

                <label for="backgroundColor">
                    Background
                </label>

                <input
                    type="color"
                    id="backgroundColor"
                    value="#ffffff"
                >

            </div>


            <!-- Control Buttons -->

            <div class="control-actions">

                <button
                    id="generateBoard"
                    type="button"
                >
                    Generate
                </button>

                <button
                    id="bulkImportButton"
                    type="button"
                >
                    Bulk Import
                </button>

                <button
                    id="clearBoardButton"
                    type="button"
                >
                    Clear
                </button>

                <button
                    id="undoButton"
                    type="button"
                >
                    Undo
                </button>

                <button
                    id="redoButton"
                    type="button"
                >
                    Redo
                </button>

            </div>

        </section>


        <!-- ========================================
             Board
        ========================================= -->

        <div class="board-container">

            <section
                id="board"
                class="board"
            ></section>

        </div>


        <!-- ========================================
             Download
        ========================================= -->

        <div class="download-container">

            <button
                id="downloadButton"
                type="button"
                class="download-button primary-button"
            >
                Download
            </button>

            <div
                id="downloadMenu"
                class="download-menu"
            >

                <button
                    id="downloadPngButton"
                    type="button"
                    data-format="png"
                >
                    PNG
                </button>

                <button
                    id="downloadJpgButton"
                    type="button"
                    data-format="jpg"
                >
                    JPG
                </button>

                <button
                    id="downloadWebpButton"
                    type="button"
                    data-format="webp"
                >
                    WebP
                </button>

                <button
                    id="closeDownloadMenuButton"
                    type="button"
                >
                    Close
                </button>

            </div>

        </div>

    </main>


    <!-- ========================================
         Library Overlay
    ========================================= -->

    <div
        id="libraryOverlay"
        class="library-overlay"
    ></div>


    <!-- ========================================
         Library Panel
    ========================================= -->

    <aside
        id="libraryPanel"
        class="library-panel"
        aria-hidden="true"
    >

        <div class="library-header">

            <h2>
                My Grids
            </h2>

            <button
                id="libraryCloseButton"
                type="button"
                class="library-close-button"
                aria-label="Close library"
            >
                ×
            </button>

        </div>


        <div
            id="libraryContent"
            class="library-content"
        ></div>


        <div class="library-actions">

            <button
                id="newGridButton"
                type="button"
            >
                New Grid
            </button>

            <button
                id="newCategoryButton"
                type="button"
            >
                New Category
            </button>

        </div>

    </aside>


    <!-- ========================================
         New Grid Modal
    ========================================= -->

    <div
        id="newGridModal"
        class="library-modal"
        aria-hidden="true"
    >

        <div class="library-modal-content">

            <h3>
                New Grid
            </h3>

            <label for="newGridNameInput">
                Grid Name
            </label>

            <input
                id="newGridNameInput"
                type="text"
                maxlength="100"
                placeholder="Enter grid name"
            >

            <div class="library-modal-actions">

                <button
                    id="cancelNewGridButton"
                    type="button"
                >
                    Cancel
                </button>

                <button
                    id="createNewGridButton"
                    type="button"
                >
                    Create
                </button>

            </div>

        </div>

    </div>


    <!-- ========================================
         Cropper Modal
    ========================================= -->

    <div
        id="cropModal"
        class="cropper-modal"
    >

        <div class="cropper-container">

            <div class="cropper-header">

                <h2>
                    Edit Image
                </h2>

                <button
                    id="closeCropperButton"
                    type="button"
                >
                    ×
                </button>

            </div>


            <div class="cropper-body">

                <div class="cropper-image-container">

                    <img
                        id="cropImage"
                        src=""
                        alt="Image editor"
                    >

                </div>


                <div class="cropper-controls">

                    <div class="cropper-button-row">

                        <button
                            id="rotateLeftButton"
                            type="button"
                        >
                            Rotate Left
                        </button>

                        <button
                            id="rotateRightButton"
                            type="button"
                        >
                            Rotate Right
                        </button>

                        <button
                            id="flipHorizontalButton"
                            type="button"
                        >
                            Flip Horizontal
                        </button>

                        <button
                            id="flipVerticalButton"
                            type="button"
                        >
                            Flip Vertical
                        </button>

                    </div>


                    <div class="editor-section">

                        <h3>
                            Adjust
                        </h3>

                        <div class="editor-control">

                            <label for="brightnessRange">
                                Brightness
                            </label>

                            <input
                                id="brightnessRange"
                                type="range"
                                min="0"
                                max="200"
                                value="100"
                            >

                            <span id="brightnessValue">
                                100%
                            </span>

                        </div>


                        <div class="editor-control">

                            <label for="contrastRange">
                                Contrast
                            </label>

                            <input
                                id="contrastRange"
                                type="range"
                                min="0"
                                max="200"
                                value="100"
                            >

                            <span id="contrastValue">
                                100%
                            </span>

                        </div>


                        <div class="editor-control">

                            <label for="saturationRange">
                                Saturation
                            </label>

                            <input
                                id="saturationRange"
                                type="range"
                                min="0"
                                max="200"
                                value="100"
                            >

                            <span id="saturationValue">
                                100%
                            </span>

                        </div>


                        <div class="editor-control">

                            <label for="blurRange">
                                Blur
                            </label>

                            <input
                                id="blurRange"
                                type="range"
                                min="0"
                                max="20"
                                value="0"
                            >

                            <span id="blurValue">
                                0px
                            </span>

                        </div>

                    </div>


                    <div class="editor-section">

                        <h3>
                            Filters
                        </h3>

                        <div
                            id="filterButtons"
                            class="filter-buttons"
                        >

                            <button
                                type="button"
                                data-filter="original"
                            >
                                Original
                            </button>

                            <button
                                type="button"
                                data-filter="grayscale"
                            >
                                Grayscale
                            </button>

                            <button
                                type="button"
                                data-filter="sepia"
                            >
                                Sepia
                            </button>

                            <button
                                type="button"
                                data-filter="warm"
                            >
                                Warm
                            </button>

                            <button
                                type="button"
                                data-filter="cool"
                            >
                                Cool
                            </button>

                            <button
                                type="button"
                                data-filter="vintage"
                            >
                                Vintage
                            </button>

                            <button
                                type="button"
                                data-filter="highContrast"
                            >
                                High Contrast
                            </button>

                        </div>

                    </div>

                </div>

            </div>


            <div class="cropper-footer">

                <button
                    id="cancelButton"
                    type="button"
                >
                    Cancel
                </button>

                <button
                    id="cropButton"
                    type="button"
                >
                    Apply
                </button>

            </div>

        </div>

    </div>


    <!-- ========================================
         Image Menu
    ========================================= -->

    <div
        id="imageMenu"
        class="image-menu"
    >

        <button
            id="updateImageButton"
            type="button"
        >
            Edit Image
        </button>

        <button
            id="replaceImageButton"
            type="button"
        >
            Replace Image
        </button>

        <button
            id="replaceWithMalButton"
            type="button"
        >
            Replace with MAL
        </button>

        <button
            id="deleteImageButton"
            type="button"
            class="danger-button"
        >
            Delete Image
        </button>

        <button
            id="closeImageMenuButton"
            type="button"
        >
            Close
        </button>

    </div>


    <!-- ========================================
         Add Image Menu
    ========================================= -->

    <div
        id="addImageMenu"
        class="add-image-menu"
    >

        <button
            id="uploadImageButton"
            type="button"
        >
            Upload Image
        </button>

        <button
            id="searchMalButton"
            type="button"
        >
            Search MAL
        </button>

        <button
            id="closeAddImageMenuButton"
            type="button"
        >
            Close
        </button>

    </div>


    <!-- ========================================
         Hidden File Input
    ========================================= -->

    <input
        id="imageInput"
        type="file"
        accept="image/*"
        hidden
    >


    <!-- ========================================
         MAL Search Modal
    ========================================= -->

    <div
        id="malSearchModal"
        class="mal-search-modal"
    >

        <div class="mal-search-container">

            <div class="mal-search-header">

                <h2>
                    MyAnimeList Search
                </h2>

                <button
                    id="malSearchCloseButton"
                    type="button"
                >
                    ×
                </button>

            </div>


            <div class="mal-search-tabs">

                <button
                    id="malCharacterTab"
                    type="button"
                    class="active"
                >
                    Characters
                </button>

                <button
                    id="malAnimeTab"
                    type="button"
                >
                    Anime
                </button>

            </div>


            <div class="mal-search-controls">

                <input
                    id="malSearchInput"
                    type="text"
                    placeholder="Search..."
                >

                <button
                    id="malSearchButton"
                    type="button"
                >
                    Search
                </button>

            </div>


            <div
                id="malSearchStatus"
                class="mal-search-status"
            ></div>


            <div
                id="malSearchResults"
                class="mal-search-results"
            ></div>


            <button
                id="malSearchBackButton"
                type="button"
                class="mal-search-back-button"
            >
                Back
            </button>

        </div>

    </div>


    <!-- ========================================
         Main JavaScript
    ========================================= -->

    <script
        type="module"
        src="./js/main.js"
    ></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Grid Generator</title>

    <!-- CropperJS -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css"
    >

    <!-- Main Styles -->
    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


    <!-- ========================================
         Main Application
    ========================================= -->

    <main class="app">


        <!-- ========================================
             Controls
        ========================================= -->

        <section class="controls">


            <!-- Rows -->

            <div class="control-group">

                <label for="rows">
                    Rows
                </label>

                <select id="rows">

                    <option value="1">
                        1
                    </option>

                    <option value="2">
                        2
                    </option>

                    <option
                        value="3"
                        selected
                    >
                        3
                    </option>

                    <option value="4">
                        4
                    </option>

                    <option value="5">
                        5
                    </option>

                    <option value="6">
                        6
                    </option>

                    <option value="7">
                        7
                    </option>

                    <option value="8">
                        8
                    </option>

                    <option value="9">
                        9
                    </option>

                    <option value="10">
                        10
                    </option>

                </select>

            </div>


            <!-- Dimension Separator -->

            <div class="dimension-separator">
                ×
            </div>


            <!-- Columns -->

            <div class="control-group">

                <label for="columns">
                    Columns
                </label>

                <select id="columns">

                    <option value="1">
                        1
                    </option>

                    <option value="2">
                        2
                    </option>

                    <option
                        value="3"
                        selected
                    >
                        3
                    </option>

                    <option value="4">
                        4
                    </option>

                    <option value="5">
                        5
                    </option>

                    <option value="6">
                        6
                    </option>

                    <option value="7">
                        7
                    </option>

                    <option value="8">
                        8
                    </option>

                    <option value="9">
                        9
                    </option>

                    <option value="10">
                        10
                    </option>

                </select>

            </div>


            <!-- Image Ratio -->

            <div class="control-group ratio-control">

                <label for="imageRatio">
                    Image Ratio
                </label>

                <select id="imageRatio">

                    <option value="1:1">
                        1:1 — Square
                    </option>

                    <option value="4:3">
                        4:3 — Standard
                    </option>

                    <option value="3:2">
                        3:2 — Photo
                    </option>

                    <option value="16:9">
                        16:9 — Widescreen
                    </option>

                    <option value="3:4">
                        3:4 — Portrait
                    </option>

                    <option value="2:3">
                        2:3 — Portrait Photo
                    </option>

                    <option value="9:16">
                        9:16 — Vertical
                    </option>

                </select>

            </div>


            <!-- Spacing -->

            <div class="control-group spacing-control">

                <label for="spacing">
                    Spacing
                </label>

                <div class="range-control">

                    <input
                        type="range"
                        id="spacing"
                        min="0"
                        max="50"
                        value="0"
                    >

                    <span id="spacingValue">
                        0 px
                    </span>

                </div>

            </div>


            <!-- Background -->

            <div class="control-group">

                <label for="backgroundColor">
                    Background
                </label>

                <input
                    type="color"
                    id="backgroundColor"
                    value="#ffffff"
                >

            </div>


            <!-- Control Actions -->

            <div class="control-actions">

                <button
                    id="generateBoard"
                    type="button"
                >
                    Generate
                </button>

                <button
                    id="bulkImportButton"
                    type="button"
                >
                    Bulk Import
                </button>

                <button
                    id="clearBoardButton"
                    type="button"
                >
                    Clear
                </button>

                <button
                    id="undoButton"
                    type="button"
                >
                    Undo
                </button>

                <button
                    id="redoButton"
                    type="button"
                >
                    Redo
                </button>

                <button
                    id="libraryButton"
                    type="button"
                    class="library-button"
                >
                    My Grids
                </button>

            </div>

        </section>


        <!-- ========================================
             Board
        ========================================= -->

        <div class="board-container">

            <section
                id="board"
                class="board"
            ></section>

        </div>


        <!-- ========================================
             Download
        ========================================= -->

        <div class="download-container">

            <button
                id="downloadButton"
                type="button"
                class="download-button"
            >
                Download
            </button>


            <div
                id="downloadMenu"
                class="download-menu"
            >

                <button
                    id="downloadPngButton"
                    type="button"
                    data-format="png"
                >
                    PNG
                </button>

                <button
                    id="downloadJpgButton"
                    type="button"
                    data-format="jpg"
                >
                    JPG
                </button>

                <button
                    id="downloadWebpButton"
                    type="button"
                    data-format="webp"
                >
                    WebP
                </button>

            </div>

        </div>

    </main>


    <!-- ========================================
         Library Overlay
    ========================================= -->

    <div
        id="libraryOverlay"
        class="library-overlay"
    ></div>


    <!-- ========================================
         Library Panel
    ========================================= -->

    <aside
        id="libraryPanel"
        class="library-panel"
        aria-hidden="true"
    >

        <div class="library-header">

            <h2>
                My Grids
            </h2>

            <button
                id="libraryCloseButton"
                type="button"
                class="library-close-button"
                aria-label="Close library"
            >
                ×
            </button>

        </div>


        <div
            id="libraryContent"
            class="library-content"
        ></div>


        <div class="library-actions">

            <button
                id="newGridButton"
                type="button"
            >
                New Grid
            </button>

            <button
                id="newCategoryButton"
                type="button"
            >
                New Category
            </button>

        </div>

    </aside>


    <!-- ========================================
         New Grid Modal
    ========================================= -->

    <div
        id="newGridModal"
        class="library-modal"
        aria-hidden="true"
    >

        <div class="library-modal-content">

            <h3>
                New Grid
            </h3>

            <label for="newGridNameInput">
                Grid Name
            </label>

            <input
                id="newGridNameInput"
                type="text"
                maxlength="100"
                placeholder="Enter grid name"
            >

            <div class="library-modal-actions">

                <button
                    id="cancelNewGridButton"
                    type="button"
                >
                    Cancel
                </button>

                <button
                    id="createNewGridButton"
                    type="button"
                >
                    Create
                </button>

            </div>

        </div>

    </div>


    <!-- ========================================
         Crop / Image Editor Modal
    ========================================= -->

    <div
        id="cropModal"
        class="image-editor-modal"
    >

        <div class="image-editor">

            <!-- Header -->

            <div class="editor-header">

                <h2>
                    Edit Image
                </h2>

                <button
                    type="button"
                    class="editor-close"
                    aria-label="Close image editor"
                >
                    ×
                </button>

            </div>


            <!-- Preview -->

            <div class="editor-preview">

                <img
                    id="cropImage"
                    src=""
                    alt="Image editor preview"
                >

            </div>


            <!-- Tools -->

            <div class="editor-tools">

                <button
                    type="button"
                    class="editor-tool active"
                    data-tool="transform"
                >
                    Transform
                </button>

                <button
                    type="button"
                    class="editor-tool"
                    data-tool="adjust"
                >
                    Adjust
                </button>

                <button
                    type="button"
                    class="editor-tool"
                    data-tool="filters"
                >
                    Filters
                </button>

                <button
                    id="restoreOriginalButton"
                    type="button"
                    class="restore-original-tab"
                >
                    Restore Original
                </button>

            </div>


            <!-- Transform Panel -->

            <div
                class="editor-panel active"
                data-panel="transform"
            >

                <div class="editor-button-row">

                    <button
                        id="rotateLeftButton"
                        type="button"
                    >
                        Rotate Left
                    </button>

                    <button
                        id="rotateRightButton"
                        type="button"
                    >
                        Rotate Right
                    </button>

                    <button
                        id="flipHorizontalButton"
                        type="button"
                    >
                        Flip Horizontal
                    </button>

                    <button
                        id="flipVerticalButton"
                        type="button"
                    >
                        Flip Vertical
                    </button>

                </div>

            </div>


            <!-- Adjust Panel -->

            <div
                class="editor-panel"
                data-panel="adjust"
            >

                <div class="adjust-controls">


                    <!-- Brightness -->

                    <div class="editor-control">

                        <label for="brightnessInput">
                            Brightness
                        </label>

                        <input
                            id="brightnessInput"
                            type="range"
                            min="0"
                            max="200"
                            value="100"
                        >

                        <span id="brightnessValue">
                            100%
                        </span>

                    </div>


                    <!-- Contrast -->

                    <div class="editor-control">

                        <label for="contrastInput">
                            Contrast
                        </label>

                        <input
                            id="contrastInput"
                            type="range"
                            min="0"
                            max="200"
                            value="100"
                        >

                        <span id="contrastValue">
                            100%
                        </span>

                    </div>


                    <!-- Saturation -->

                    <div class="editor-control">

                        <label for="saturationInput">
                            Saturation
                        </label>

                        <input
                            id="saturationInput"
                            type="range"
                            min="0"
                            max="200"
                            value="100"
                        >

                        <span id="saturationValue">
                            100%
                        </span>

                    </div>


                    <!-- Blur -->

                    <div class="editor-control">

                        <label for="blurInput">
                            Blur
                        </label>

                        <input
                            id="blurInput"
                            type="range"
                            min="0"
                            max="20"
                            value="0"
                        >

                        <span id="blurValue">
                            0px
                        </span>

                    </div>

                </div>

            </div>


            <!-- Filters Panel -->

            <div
                class="editor-panel"
                data-panel="filters"
            >

                <div
                    id="filterButtons"
                    class="filter-buttons"
                >

                    <button
                        type="button"
                        class="filter-button"
                        data-filter="none"
                    >
                        Original
                    </button>

                    <button
                        type="button"
                        class="filter-button"
                        data-filter="grayscale"
                    >
                        Grayscale
                    </button>

                    <button
                        type="button"
                        class="filter-button"
                        data-filter="sepia"
                    >
                        Sepia
                    </button>

                    <button
                        type="button"
                        class="filter-button"
                        data-filter="warm"
                    >
                        Warm
                    </button>

                    <button
                        type="button"
                        class="filter-button"
                        data-filter="cool"
                    >
                        Cool
                    </button>

                    <button
                        type="button"
                        class="filter-button"
                        data-filter="vintage"
                    >
                        Vintage
                    </button>

                    <button
                        type="button"
                        class="filter-button"
                        data-filter="high-contrast"
                    >
                        High Contrast
                    </button>

                </div>

            </div>


            <!-- Editor Footer -->

            <div class="editor-footer">

                <button
                    id="cancelButton"
                    type="button"
                >
                    Cancel
                </button>

                <button
                    id="cropButton"
                    type="button"
                >
                    Apply
                </button>

            </div>

        </div>

    </div>


    <!-- ========================================
         Image Menu
    ========================================= -->

    <div
        id="imageMenu"
        class="image-menu"
    >

        <button
            id="updateImageButton"
            type="button"
        >
            Edit Image
        </button>

        <button
            id="replaceImageButton"
            type="button"
        >
            Replace Image
            <span class="menu-arrow">›</span>
        </button>

        <button
            id="deleteImageButton"
            type="button"
            class="danger-button"
        >
            Delete Image
        </button>

        <button
            id="closeImageMenuButton"
            type="button"
        >
            Close
        </button>

    </div>


    <!-- ========================================
         Replace Image Source Menu
         IMPORTANT: This is a sibling of imageMenu.
    ========================================= -->

    <div
        id="replaceImageSourceMenu"
        class="image-source-menu"
    >

        <button
            id="backToImageMenuButton"
            type="button"
            class="menu-back-button"
        >
            <span>‹</span>
            Replace Image
        </button>

        <div class="menu-divider"></div>

        <button
            id="replaceUploadImageButton"
            type="button"
        >
            Upload Image
        </button>

        <button
            id="replaceWithMalButton"
            type="button"
        >
            MyAnimeList
        </button>

        <button
            id="replaceImageSearchButton"
            type="button"
        >
            Image Search
        </button>

        <button
            id="replaceUrlImageButton"
            type="button"
            disabled
        >
            URL
        </button>

    </div>


    <!-- ========================================
         Add Image Menu
    ========================================= -->

    <div
        id="addImageMenu"
        class="add-image-menu"
    >

        <button
            id="openImageSourceMenuButton"
            type="button"
        >
            Add Image
            <span class="menu-arrow">›</span>
        </button>

        <button
            id="closeAddImageMenuButton"
            type="button"
        >
            Close
        </button>

    </div>


    <!-- ========================================
         Add Image Source Menu
    ========================================= -->

    <div
        id="imageSourceMenu"
        class="image-source-menu"
    >

        <button
            id="backToAddImageMenuButton"
            type="button"
            class="menu-back-button"
        >
            <span>‹</span>
            Add Image
        </button>

        <div class="menu-divider"></div>

        <button
            id="uploadImageButton"
            type="button"
        >
            Upload Image
        </button>

        <button
            id="searchMalButton"
            type="button"
        >
            MyAnimeList
        </button>

        <button
            id="imageSearchButton"
            type="button"
        >
            Image Search
        </button>

        <button
            id="urlImageButton"
            type="button"
            disabled
        >
            URL
        </button>

    </div>


    <!-- ========================================
         MAL Search Modal
    ========================================= -->

    <div
        id="malSearchModal"
        class="mal-search-modal"
    >

        <div class="mal-search-container">


            <!-- Header -->

            <div class="mal-search-header">

                <h2>
                    MyAnimeList Search
                </h2>

                <button
                    id="malSearchCloseButton"
                    type="button"
                    aria-label="Close MyAnimeList search"
                >
                    ×
                </button>

            </div>


            <!-- Tabs -->

            <div class="mal-search-tabs">

                <button
                    id="malCharacterTab"
                    type="button"
                    class="active"
                >
                    Characters
                </button>

                <button
                    id="malAnimeTab"
                    type="button"
                >
                    Anime
                </button>

            </div>


            <!-- Search Controls -->

            <div class="mal-search-controls">

                <input
                    id="malSearchInput"
                    type="text"
                    placeholder="Search for a character..."
                    autocomplete="off"
                >

                <button
                    id="malSearchButton"
                    type="button"
                >
                    Search
                </button>

            </div>


            <!-- Status -->

            <div
                id="malSearchStatus"
                class="mal-search-status"
            ></div>


            <!-- Results -->

            <div
                id="malSearchResults"
                class="mal-search-results"
            ></div>


            <!-- Back -->

            <button
                id="malSearchBackButton"
                type="button"
                class="mal-search-back-button"
            >
                Back
            </button>

        </div>

    </div>


    <!-- ========================================
         Image Search Modal
    ========================================= -->

    <div
        id="imageSearchModal"
        class="image-search-modal"
    >

        <div class="image-search-window">


            <!-- Header -->

            <div class="image-search-header">

                <h2>
                    Image Search
                </h2>

                <button
                    id="imageSearchCloseButton"
                    type="button"
                    class="editor-close"
                    aria-label="Close image search"
                >
                    ×
                </button>

            </div>


            <!-- Search Controls -->

            <div class="image-search-controls">

                <input
                    id="imageSearchInput"
                    type="text"
                    placeholder="Search for an image..."
                    autocomplete="off"
                >

                <button
                    id="imageSearchSubmitButton"
                    type="button"
                >
                    Search
                </button>

            </div>


            <!-- Status -->

            <div
                id="imageSearchStatus"
                class="image-search-status"
            ></div>


            <!-- Results -->

            <div
                id="imageSearchResults"
                class="image-search-results"
            ></div>


            <!-- Pagination -->

            <div class="image-search-pagination">

                <button
                    id="imageSearchPreviousButton"
                    type="button"
                    disabled
                >
                    Previous
                </button>

                <button
                    id="imageSearchNextButton"
                    type="button"
                    disabled
                >
                    Next
                </button>

            </div>

        </div>

    </div>


    <!-- ========================================
         CropperJS
    ========================================= -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"
    ></script>


    <!-- ========================================
         Main JavaScript
    ========================================= -->

    <script
        type="module"
        src="./js/main.js"
    ></script>


</body>

</html>

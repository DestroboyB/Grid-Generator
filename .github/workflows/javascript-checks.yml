name: JavaScript Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    name: Check JavaScript syntax
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check all JavaScript modules
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find js -type f -name '*.js' -print0 | sort -z)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No JavaScript files found under js/"
            exit 1
          fi

          for file in "${files[@]}"; do
            echo "Checking $file"
            node --experimental-default-type=module --check "$file"
          done

  browser-tests:
    name: Browser regression tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Record Playwright and browser versions
        run: |
          npx playwright --version
          npm ls @playwright/test
          node -p "JSON.stringify(require('./node_modules/playwright-core/browsers.json').browsers.filter(browser => browser.name === 'chromium'), null, 2)"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm test
